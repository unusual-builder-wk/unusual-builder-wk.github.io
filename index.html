<style>
/* Layout: one long page, left-aligned text, big gear mark in the hero, three-up strengths, story as two-column prose */
:root{
  --bg:#edf3f3; --surface:#ffffff; --fg:#0f2628; --muted:#4a6466; --line:#cddcdc;
  --accent:#0b6b6b; --accent2:#18a89a; --on-accent:#ffffff; --tint:#dcebea;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1617; --surface:#112123; --fg:#e3eeee; --muted:#93aeb0; --line:#1e3739;
  --accent:#2fd1c0; --accent2:#2fd1c0; --on-accent:#05302c; --tint:#12302f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1617; --surface:#112123; --fg:#e3eeee; --muted:#93aeb0; --line:#1e3739;
  --accent:#2fd1c0; --accent2:#2fd1c0; --on-accent:#05302c; --tint:#12302f; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 17px/1.6 var(--body);margin:0;padding-inline:20px}
.wrap{max-width:1040px;margin-inline:auto}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.eyebrow{font:600 .78rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-20px;padding:10px 20px}
.bar{display:flex;align-items:center;gap:14px;max-width:1040px;margin-inline:auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font:800 1.15rem/1 var(--display);font-style:italic}
.brand b{color:var(--accent);font-weight:800}
nav{display:flex;gap:18px;margin-left:auto;align-items:center;flex-wrap:wrap}
nav a.l{color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem}
nav a.l:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:6px 10px;font:600 .8rem/1 var(--body);color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lang button:focus-visible,a:focus-visible,.btn:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

.hero{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding-block:clamp(40px,8vw,88px);overflow:hidden}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.2rem);font-weight:800;margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;padding:13px 22px;border-radius:10px;font:700 1rem/1 var(--body);text-decoration:none;border:2px solid var(--accent);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:transparent;color:var(--accent)}
.mark{justify-self:center;width:min(100%,300px);aspect-ratio:1;position:relative}
.mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 30px rgba(7,60,60,.28))}
.gears{position:absolute;right:-60px;bottom:-80px;width:340px;opacity:.07;color:var(--accent);pointer-events:none}
.gears svg{width:100%;height:auto;display:block}
.note{margin-top:14px;font-size:.88rem;color:var(--muted)}

section{padding-block:clamp(36px,6vw,64px);border-top:1px solid var(--line)}
section>.eyebrow{display:block;margin-bottom:12px}
.strengths{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card h3{margin-bottom:8px}
.card p{color:var(--muted);font-size:.98rem}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 36px;margin-top:22px}
.feat div{padding-block:16px;border-bottom:1px solid var(--line);min-width:0}
.feat h3{font-size:1.05rem;margin-bottom:4px}
.feat p{color:var(--muted);font-size:.97rem}
.prose{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:36px;margin-top:6px}
.prose .txt{display:flex;flex-direction:column;gap:14px;max-width:38em}
.prose h2{margin-bottom:6px}
.sub{margin-top:44px}
.values{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:12px}
.values li{background:var(--tint);border-radius:12px;padding:16px 20px;font:700 1.08rem/1.35 var(--display);font-style:italic}
.credit{margin-top:22px;font:600 1.05rem/1.4 var(--display);color:var(--fg)}
.disc{background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:16px 20px;color:var(--muted);font-size:.95rem;margin-top:22px}
.mail{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.mail code{font:600 1.05rem/1 var(--body);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;user-select:all;overflow-wrap:anywhere}
footer .n{max-width:46em;line-height:1.5}
footer{border-top:1px solid var(--line);padding-block:28px 36px;color:var(--muted);font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .mark{width:150px;justify-self:start;order:-1}
  .strengths,.prose{grid-template-columns:1fr}
  nav{margin-left:0;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

g1:"Les Unusual Italians sont nés en 2011, pendant la bêta de Wakfu, avec l'ouverture du serveur international Remington. Beaucoup d'entre nous avaient déjà joué lors des phases précédentes de la bêta et, même si la base de joueurs actifs a beaucoup changé depuis, le noyau dur des Unusual se connecte toujours, imperturbable.",
g2:"Pendant longtemps, nous avons été la seule guilde de référence de la communauté italienne. Notre seule prétention était d'offrir un groupe soudé avec lequel découvrir ce jeu ensemble.",
g3:"Avec la sortie de la version Gold et l'arrivée de nouvelles guildes italiennes, nous avons pu (et même dû) changer certaines choses. Nous avons choisi de devenir une grande guilde centrée sur une seule nation de Wakfu, en restreignant un peu nos critères d'entrée sans trahir nos idées d'origine.",
g4:"Aujourd'hui, nous jouons sur le serveur Rubilax. Nous sommes l'une des guildes italiennes les plus actives du jeu : un effectif plus petit que celui des grandes guildes internationales, mais un groupe soudé et passionné, souvent parmi les meilleures guildes du classement en jeu.",
em_h:"Notre emblème",e1:"Le premier chef des Unusual Italians a créé la guilde avec un fond clair et des engrenages verts. Ce style a été conservé depuis, et respecté par tous les chefs qui ont suivi. Quand Neosboom et son co-chef Palumma ont pris la relève, ils ont pris soin de cet héritage avec encore plus d'attention.",e2:"Nous tenons à avoir une histoire, et surtout à construire une communauté italienne. Le jeu est en anglais, et les nouveaux joueurs peuvent se sentir perdus les premiers jours. Chez nous, ils trouvent de l'aide, un canal Discord et de vraies personnes qui connaissent bien le jeu et son évolution. Les deux engrenages de notre logo viennent de cet emblème, et nous les avons gardés pour Unusual Builder.",credit:"Créé par <strong>Neosboom</strong>, chef de la guilde Unusual Italians, qui a construit Unusual Builder pendant son temps libre, gratuitement, par amour du jeu.",
why_h:"Pourquoi Unusual Builder ?",
w1:"Le nom vient de notre guilde, les <strong>Unusual Italians</strong>, qui jouent ensemble à Wakfu depuis 2011.",
w2:"Ces dernières années, le jeu nous a donné de nombreuses raisons de revenir. Les mises à jour nous ont ravis, et une nouvelle communauté italienne s'est formée autour de Wakfu, avec des vétérans de retour et de nouveaux joueurs de haut niveau. Ensemble, nous avons retrouvé le plaisir du theorycraft, du partage de builds et de la recherche du moindre point à gagner sur un set.",
w3:"Avec tous les objets, classes, passifs et mécaniques du jeu en 2026, nous avons senti que c'était le bon moment de créer quelque chose à nous. Unusual Builder a été créé par des joueurs expérimentés, pour des joueurs. C'est un projet de passion, fait avec le sourire, qui ne se prend pas trop au sérieux.",
v1:"Unusual Builder a été fait pour unir, pas pour diviser.",v2:"Il existe pour rendre Wakfu plus agréable et aider les joueurs à construire le personnage dont ils rêvent.",v3:"Il est gratuit, sans but lucratif, et fait par amour du jeu.",v4:"Construit par la communauté, pour la communauté. À bientôt dans le Monde des Douze !",
disc:"WAKFU est un MMORPG édité par Ankama. Unusual Builder est un projet de fans non officiel, sans aucun lien avec Ankama. Les images du jeu sont la propriété d'Ankama Games et/ou de leurs auteurs respectifs et ne peuvent pas être utilisées à des fins commerciales.",
contact_eye:"Contact",contact_h:"Questions, bugs, idées",contact_p:"Écrivez-nous. Vous pouvez aussi utiliser le bouton Signaler un bug dans l'app.",copy:"Copier l'adresse",
priv_eye:"Confidentialité",priv_h:"Vos données restent chez vous",
priv_p:"Unusual Builder ne demande pas de créer un compte. Vos builds, presets et réglages sont stockés dans votre navigateur ou votre téléphone. Si vous envoyez un signalement de bug, nous recevons le message que vous écrivez, et nous utilisons votre adresse e-mail uniquement pour répondre.",
foot1:"Projet de fans gratuit",foot2:"WAKFU est un MMORPG édité par Ankama. Unusual Builder est un projet de fans non officiel, sans aucun lien avec Ankama. Les images du jeu sont la propriété d'Ankama Games et/ou de leurs auteurs respectifs et ne peuvent pas être utilisées à des fins commerciales."},

nav_why:"Nuestra historia",nav_feat:"Funciones",nav_contact:"Contacto",
tag:"Un planificador de builds de Wakfu, hecho por jugadores",
h1:"Planifica tu build de Wakfu <em>como lo cuenta el juego.</em>",
lead:"Unusual Builder es un planificador de builds gratuito y no oficial para Wakfu. Elige una clase, equipa objetos, runas y sublimaciones, escoge hechizos y pasivas, y mira cómo se actualizan tus estadísticas al instante.",
open:"Abrir el builder",story_btn:"Nuestra historia",free_note:"Gratis. Sin cuenta. Funciona en el móvil.",
s1h:"Fiel al juego",s1p:"Objetos, rarezas, niveles y estadísticas siguen los datos del juego, y los requisitos de los objetos los revisan jugadores con experiencia.",
s2h:"Pensado para el móvil",s2p:"Diseñado para usarse con comodidad en el smartphone. Guarda tus builds y compártelas con un enlace o un código.",
s3h:"Hecho con la comunidad",s3p:"Presets de la comunidad, reporte de errores dentro de la app y actualizaciones guiadas por lo que cuentan los jugadores.",
feat_eye:"Qué hace",feat_h:"Todo lo que necesitas para una build, en un solo sitio.",
f1h:"Las 18 clases",f1p:"Hechizos y pasivas de cada clase, con los niveles de desbloqueo del juego.",
f2h:"Base de objetos completa",f2p:"Busca por nombre, nivel, rareza y ranura, en inglés, francés, español y portugués.",
f3h:"Estadísticas en vivo",f3p:"Los totales se actualizan al equipar. Maestría y resistencia cuentan en los elementos que elijas.",
f4h:"Requisitos de objetos",f4p:"Aparece un aviso cuando un objeto pide algo que tu build no cumple, como un límite de PA o de PM.",
f5h:"Guardar, compartir, explorar",f5p:"Guarda tus builds en tu dispositivo, compártelas por enlace o código y explora los presets de la comunidad.",
f6h:"Reportar un error",f6p:"¿Una estadística incorrecta o un objeto que falta? Envía un reporte desde la app.",
story_eye:"Nuestra historia",story_h:"Los Unusual Italians",
g1:"Los Unusual Italians nacieron en 2011, durante la beta de Wakfu, con la apertura del servidor internacional Remington. Muchos ya habíamos jugado en las fases anteriores de la beta y, aunque la base de jugadores activos ha cambiado mucho desde entonces, el núcleo duro de los Unusual sigue conectándose, impertérrito.",
g2:"Durante mucho tiempo fuimos el único gremio de referencia de la comunidad italiana. Nuestra única pretensión era ofrecer un grupo unido con el que descubrir este juego juntos.",
g3:"Con la llegada de la versión Gold y el nacimiento de nuevos gremios italianos, pudimos (y de hecho tuvimos que) hacer algunos cambios. Elegimos convertirnos en un gran gremio centrado en una sola nación de Wakfu, endureciendo un poco los criterios de entrada sin traicionar nuestras ideas originales.",
g4:"Hoy jugamos en el servidor Rubilax. Somos uno de los gremios italianos más activos del juego: una plantilla menor que la de los grandes gremios internacionales, pero un grupo unido y apasionado que a menudo aparece entre los mejores gremios de la clasificación del juego.",
em_h:"Nuestro emblema",e1:"El primer líder de los Unusual Italians creó el gremio con un fondo claro y engranajes verdes. Ese estilo se ha mantenido desde entonces y lo han respetado todos los líderes que vinieron después. Cuando Neosboom y su colíder Palumma tomaron el relevo, cuidaron ese legado con todavía más atención.",e2:"Nos importa tener una historia y, sobre todo, construir una comunidad italiana. El juego está en inglés y los jugadores nuevos pueden sentirse perdidos los primeros días. Con nosotros encuentran ayuda, un canal de Discord y personas reales que conocen bien el juego y cómo ha cambiado con el tiempo. Los dos engranajes de nuestro logo vienen de ese emblema, y los hemos conservado para Unusual Builder.",credit:"Creado por <strong>Neosboom</strong>, líder del gremio Unusual Italians, que construyó Unusual Builder en su tiempo libre, gratis y por amor al juego.",
why_h:"¿Por qué Unusual Builder?",
w1:"El nombre viene de nuestro gremio, los <strong>Unusual Italians</strong>, que juegan juntos a Wakfu desde 2011.",
w2:"En los últimos años el juego nos ha dado muchos motivos para volver. Las actualizaciones nos han encantado, y se ha formado una nueva comunidad italiana en torno a Wakfu, con veteranos que regresan y nuevos jugadores de alto nivel. Juntos hemos recuperado el placer del theorycraft, de compartir builds y de exprimir hasta el último punto de un set.",
w3:"Con tantos objetos, clases, pasivas y mecánicas en el juego en 2026, sentimos que era el momento de crear algo propio. Unusual Builder lo han creado jugadores con experiencia, para jugadores. Es un proyecto de pasión, hecho con una sonrisa, que no se toma demasiado en serio.",
v1:"Unusual Builder se hizo para unir, no para dividir.",v2:"Existe para hacer Wakfu más divertido y ayudar a los jugadores a construir el personaje con el que sueñan.",v3:"Es gratuito, sin ánimo de lucro, y hecho por amor al juego.",v4:"Hecho por la comunidad, para la comunidad. ¡Nos vemos en el Mundo de los Doce!",
disc:"Wakfu es un MMORPG editado por Ankama. Unusual Builder es un proyecto de fans no oficial, sin ningún vínculo con Ankama. Las imágenes del juego son propiedad de Ankama Games y/o de sus respectivos autores y no pueden usarse con fines comerciales.",
contact_eye:"Contacto",contact_h:"Preguntas, errores, ideas",contact_p:"Escríbenos. También puedes usar el botón Reportar un error dentro de la app.",copy:"Copiar dirección",
priv_eye:"Privacidad",priv_h:"Tus datos se quedan contigo",
priv_p:"Unusual Builder no te pide crear una cuenta. Tus builds, presets y ajustes se guardan en tu navegador o en tu móvil. Si envías un reporte de error, recibimos el texto que escribas, y usamos tu correo solo para responderte.",
foot1:"Proyecto de fans gratuito",foot2:"Wakfu es un MMORPG editado por Ankama. Unusual Builder es un proyecto de fans no oficial, sin ningún vínculo con Ankama. Las imágenes del juego son propiedad de Ankama Games y/o de sus respectivos autores y no pueden usarse con fines comerciales."},

story_eye:"Nossa história",story_h:"Os Unusual Italians",
g1:"Os Unusual Italians nasceram em 2011, durante o beta de Wakfu, com a abertura do servidor internacional Remington. Muitos de nós já tinham jogado nas fases anteriores do beta e, embora a base de jogadores ativos tenha mudado bastante desde então, o núcleo duro dos Unusual continua entrando, impávido.",
g2:"Por muito tempo fomos a única guilda de referência da comunidade italiana. Nossa única pretensão era oferecer um grupo unido para descobrir este jogo juntos.",
g3:"Com o lançamento da versão Gold e o surgimento de novas guildas italianas, pudemos (e na verdade precisamos) fazer algumas mudanças. Escolhemos nos tornar uma grande guilda focada em uma única nação de Wakfu, restringindo um pouco os critérios de entrada sem trair nossas ideias originais.",
g4:"Hoje jogamos no servidor Rubilax. Somos uma das guildas italianas mais ativas do jogo: um elenco menor que o das grandes guildas internacionais, mas um grupo unido e apaixonado que muitas vezes aparece entre as melhores guildas do ranking do jogo.",
em_h:"Nosso emblema",e1:"O primeiro líder dos Unusual Italians criou a guilda com um fundo claro e engrenagens verdes. Esse estilo foi mantido desde então e respeitado por todos os líderes que vieram depois. Quando Neosboom e seu co-líder Palumma assumiram, cuidaram desse legado com ainda mais atenção.",e2:"Valorizamos ter uma história e, acima de tudo, construir uma comunidade italiana. O jogo é em inglês e os jogadores novos podem se sentir perdidos nos primeiros dias. Conosco encontram ajuda, um canal no Discord e pessoas reais que conhecem bem o jogo e como ele mudou ao longo do tempo. As duas engrenagens do nosso logo vêm desse emblema, e nós as mantivemos para o Unusual Builder.",credit:"Criado por <strong>Neosboom</strong>, líder da guilda Unusual Italians, que construiu o Unusual Builder no tempo livre, de graça, por amor ao jogo.",
why_h:"Por que Unusual Builder?",
w1:"O nome vem da nossa guilda, os <strong>Unusual Italians</strong>, que jogam Wakfu juntos desde 2011.",
w2:"Nos últimos anos o jogo nos deu muitos motivos para voltar. As atualizações foram uma alegria, e uma nova comunidade italiana se formou em torno de Wakfu, com veteranos voltando e novos jogadores de alto nível chegando. Juntos redescobrimos o prazer do theorycraft, de compartilhar builds e de espremer cada último ponto de um set.",
w3:"Com tantos itens, classes, passivas e mecânicas no jogo em 2026, sentimos que era a hora de criar algo nosso. O Unusual Builder foi criado por jogadores experientes, para jogadores. É um projeto de paixão, feito com um sorriso, que não se leva muito a sério.",
v1:"O Unusual Builder foi feito para unir, não para dividir.",v2:"Ele existe para tornar Wakfu mais divertido e ajudar os jogadores a montar o personagem dos seus sonhos.",v3:"É gratuito, sem fins lucrativos, e feito por amor ao jogo.",v4:"Feito pela comunidade, para a comunidade. Vejo você nos Doze Mundos!",
disc:"Wakfu é um MMORPG publicado pela Ankama. O Unusual Builder é um projeto de fãs não oficial, sem qualquer ligação com a Ankama. As imagens do jogo são propriedade da Ankama Games e/ou dos respectivos autores e não podem ser usadas para fins comerciais.",
contact_eye:"Contato",contact_h:"Dúvidas, bugs, ideias",contact_p:"Escreva para nós. Você também pode usar o botão Relatar um bug dentro do app.",copy:"Copiar endereço",
priv_eye:"Privacidade",priv_h:"Seus dados ficam com você",
priv_p:"O Unusual Builder não pede que você crie uma conta. Suas builds, presets e configurações ficam guardados no seu navegador ou celular. Se você enviar um relato de bug, recebemos o texto que escrever, e usamos seu e-mail apenas para responder.",
foot1:"Projeto de fãs gratuito",foot2:"Wakfu é um MMORPG publicado pela Ankama. O Unusual Builder é um projeto de fãs não oficial, sem qualquer ligação com a Ankama. As imagens do jogo são propriedade da Ankama Games e/ou dos respectivos autores e não podem ser usadas para fins comerciais."}

function setLang(l){
  var d=T[l]||T.en;
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(function(e){var v=d[e.dataset.i18n];e.textContent=v==null?T.en[e.dataset.i18n]:v});
  document.querySelectorAll("[data-i18n-html]").forEach(function(e){var v=d[e.dataset.i18nHtml];e.innerHTML=v==null?T.en[e.dataset.i18nHtml]:v});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===l?"true":"false")});
  try{localStorage.setItem("ub_site_lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang)})});
var cur="en";try{cur=localStorage.getItem("ub_site_lang")||"en"}catch(e){}
if(!T[cur])cur="en";setLang(cur);
document.getElementById("copy").addEventListener("click",function(){
  var t=document.getElementById("mailtxt"),btn=this,old=btn.textContent;
  function done(){btn.textContent="✓";setTimeout(function(){btn.textContent=old},1400)}
  function sel(){var r=document.createRange();r.selectNodeContents(t);var s=getSelection();s.removeAllRanges();s.addRange(r)}
  try{navigator.clipboard.writeText(t.textContent).then(done,sel)}catch(e){sel()}
});
</script>
